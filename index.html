<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>ND Music</title>
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ND Music">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0d;--bg2:#131317;--card:#1b1b21;--card2:#24242b;--line:#2c2c34;
  --text:#f5f5f7;--mute:#a7a7b3;--dim:#80808c;
  --acc:#ff5a36;--acc2:#ff9a3d;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --tab:62px;--mini:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
svg{display:block}
.hidden{display:none!important}

#main{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--sat) + 14px) 18px calc(var(--tab) + var(--mini) + var(--sab) + 28px)}
.wrap{max-width:880px;margin:0 auto}

/* header */
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;min-height:40px}
.top h1{font-size:30px;font-weight:800;letter-spacing:-.025em;margin:0;flex:1;line-height:1.1}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);flex:none}
.iconbtn:active{transform:scale(.94)}
.back{background:transparent;margin-left:-8px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-weight:800;font-size:14px;color:#140803;flex:none}

h2{font-size:19px;font-weight:700;margin:26px 0 12px;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:13px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 16px;padding:0 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 15px;border-radius:999px;background:var(--card);font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--acc);color:#140803}

/* quick tiles */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qt{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:8px;overflow:hidden;height:58px;text-align:left;font-weight:700;font-size:13px}
.qt .art{width:58px;height:58px;border-radius:0}
.qt span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;padding-right:8px}

/* rows of cards */
.hscroll{display:flex;gap:14px;overflow-x:auto;margin:0 -18px;padding:0 18px 4px;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding:0 18px}
.hscroll::-webkit-scrollbar{display:none}
.card{width:150px;flex:none;text-align:left;scroll-snap-align:start}
.card .art{width:150px;height:150px;border-radius:12px;margin-bottom:8px}
.card .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.card.round .art{border-radius:50%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:18px 14px}
.grid .card{width:auto}
.grid .card .art{width:100%;height:auto;aspect-ratio:1}

/* artwork */
.art{background:linear-gradient(145deg,#2b2b33,#18181d);display:grid;place-items:center;overflow:hidden;position:relative;flex:none;color:var(--dim)}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art:not(:has(img))::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.28),transparent 55%);pointer-events:none}
.art .yt{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.65);border-radius:4px;padding:1px 4px;font-size:9px;font-weight:800;color:#fff;letter-spacing:.04em}
.art.g1{background:linear-gradient(150deg,#ff6a3d,#c2185b 55%,#4a1050)}
.art.g2{background:linear-gradient(160deg,#1f2a44,#3d7bff 60%,#9ad1ff)}
.art.g3{background:linear-gradient(150deg,#0c3b46,#1fc8a0 70%,#c9ffe9)}
.art.g4{background:linear-gradient(140deg,#ffcf6b,#ff8a3d 50%,#8a3412)}
.art.g5{background:linear-gradient(150deg,#2a1352,#7b4dff 55%,#e0b3ff)}
.art.g6{background:linear-gradient(145deg,#ff4d8d,#3d0f2a)}
.art.fav{background:linear-gradient(145deg,#5b3dff,#b9a8ff)}
.art{container-type:inline-size}
.art .ini{font-weight:800;color:rgba(255,255,255,.9);font-size:34cqw;letter-spacing:-.02em;line-height:1}

/* track list */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:7px 0;width:100%;text-align:left;border-radius:8px}
.row:active{background:var(--card)}
.row .art{width:50px;height:50px;border-radius:6px}
.row .meta{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row.playing .t{color:var(--acc)}
.row .num{width:22px;text-align:center;color:var(--mute);font-size:14px;flex:none}
.row .more{width:36px;height:36px;display:grid;place-items:center;color:var(--mute);flex:none;border-radius:50%}
.row .dur{color:var(--dim);font-size:12.5px;flex:none}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-right:6px;vertical-align:-1px}
.eq i{width:3px;background:var(--acc);border-radius:1px;animation:eq 1s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}

/* collection header */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 0 8px;position:relative}
.hero .art{width:min(220px,58vw);height:min(220px,58vw);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.hero.round .art{border-radius:50%}
.hero h1{font-size:24px;font-weight:800;margin:18px 0 4px;letter-spacing:-.02em}
.hero .sub{font-size:14px}
.actions{display:flex;align-items:center;gap:14px;margin:18px 0 8px}
.actions .sp{flex:1}
.play{width:56px;height:56px;border-radius:50%;background:var(--acc);color:#140803;display:grid;place-items:center;box-shadow:0 8px 24px rgba(255,90,54,.35)}
.play:active{transform:scale(.95)}
.ghost{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
.ghost.on{color:var(--acc)}
.heroBg{position:absolute;left:-18px;right:-18px;top:calc(-14px - var(--sat));height:360px;z-index:-1;opacity:.55;filter:blur(40px) saturate(1.4);overflow:hidden;pointer-events:none}
.heroBg::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,var(--bg))}
.heroBg img{width:100%;height:100%;object-fit:cover}

/* empty */
.empty{text-align:center;padding:48px 20px;color:var(--mute)}
.empty .big{width:88px;height:88px;border-radius:24px;margin:0 auto 18px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#140803}
.empty h3{color:var(--text);font-size:20px;margin:0 0 8px}
.empty p{margin:0 auto 22px;max-width:320px;line-height:1.5;font-size:14px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;background:var(--acc);color:#140803;font-weight:700;font-size:15px}
.btn.sec{background:var(--card2);color:var(--text)}
.btn:active{transform:scale(.97)}

/* welcome A */
.welcome{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:space-between;padding:calc(var(--sat) + 70px) 28px calc(var(--sab) + 40px);
  background:radial-gradient(120% 70% at 50% 0%,#3a1a10 0%,#0b0b0d 60%);overflow-y:auto}
.welcome .wi{display:flex;flex-direction:column;align-items:flex-start;gap:26px;max-width:460px;margin:40px auto 0;width:100%}
.welcome .wl{width:96px;height:96px;border-radius:28px;background:radial-gradient(120% 120% at 20% 10%,#ffb15a,#ff5a36 45%,#c8321b);display:grid;place-items:center;box-shadow:0 20px 50px rgba(255,90,54,.4)}
.welcome h1{margin:0;font-size:44px;font-weight:800;letter-spacing:-.035em;line-height:1.02}
.welcome p{margin:0;font-size:16px;line-height:1.5;color:#b9b9c4}
.welcome .wb{display:flex;flex-direction:column;gap:12px;max-width:460px;margin:30px auto 0;width:100%}
.welcome .wb .btn{justify-content:center;height:56px;font-size:16px}
.btn.line{background:transparent;border:1px solid #34343d;color:var(--text)}
#dialog textarea{width:100%;min-height:110px;resize:vertical;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:15px;color:var(--text);outline:0}
#dialog textarea:focus{border-color:var(--acc)}
#dialog .hint{font-size:12.5px;color:var(--mute);line-height:1.45;margin-top:10px}
#ytWrap{width:100%;max-width:min(400px,46vh);aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;box-shadow:0 24px 60px rgba(0,0,0,.5)}
#ytWrap iframe{width:100%;height:100%;border:0;display:block}

/* search */
.search{display:flex;align-items:center;gap:10px;background:var(--text);color:#111;border-radius:10px;padding:0 14px;height:46px;margin-bottom:16px}
.search input{border:0;outline:0;background:none;flex:1;font-size:16px;color:#111;height:100%}

/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;
  padding:6px 8px calc(6px + var(--sab));background:linear-gradient(transparent,rgba(11,11,13,.92) 30%,var(--bg));height:calc(var(--tab) + var(--sab))}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--dim);padding-top:6px}
#tabs button.on{color:var(--text)}
.isWelcome #tabs,.isWelcome #mini{display:none!important}

/* mini player */
#mini{position:fixed;left:8px;right:8px;bottom:calc(var(--tab) + var(--sab) + 2px);z-index:21;height:var(--mini);border-radius:12px;
  background:#3a2219;display:flex;align-items:center;gap:10px;padding:0 6px 0 8px;overflow:hidden;max-width:864px;margin:0 auto;
  box-shadow:0 10px 30px rgba(0,0,0,.4);transition:background .4s}
#mini .art{width:48px;height:48px;border-radius:7px}
#mini .meta{flex:1;min-width:0;text-align:left}
#mini .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .s{font-size:12.5px;color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .bar{position:absolute;left:10px;right:10px;bottom:2px;height:2.5px;border-radius:2px;background:rgba(255,255,255,.18)}
#mini .bar i{display:block;height:100%;width:0;background:#fff;border-radius:2px}
#mini .ctl{width:42px;height:42px;display:grid;place-items:center;flex:none}

/* full player */
#full{position:fixed;inset:0;z-index:40;background:#111;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);overflow:hidden;touch-action:pan-y}
#full.open{transform:none}
#full .bgimg{position:absolute;inset:-60px;filter:blur(60px) saturate(1.5) brightness(.65);opacity:.9;transition:opacity .4s}
#full .bgimg img{width:100%;height:100%;object-fit:cover}
#full .shade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.55))}
#full .in{position:relative;height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;
  padding:calc(var(--sat) + 10px) 24px calc(var(--sab) + 18px)}
#full .fh{display:flex;align-items:center;justify-content:space-between;height:44px}
#full .fh .lbl{text-align:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.75);font-weight:600}
#full .fh .lbl b{display:block;text-transform:none;letter-spacing:0;font-size:13.5px;color:#fff;margin-top:2px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#full .big{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:18px 0}
#full .big .art{width:100%;max-width:min(400px,46vh);aspect-ratio:1;height:auto;border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.5);transition:transform .35s}
#full.isPaused .big .art{transform:scale(.88)}
#full .info{display:flex;align-items:center;gap:12px}
#full .info .meta{flex:1;min-width:0}
#full .info .t{font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
#full .info .s{font-size:15.5px;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.seek{margin:20px 0 4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,#fff var(--p,0%),rgba(255,255,255,.25) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;margin-top:-5px}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.25)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:#fff}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:0}
.times{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.65);font-variant-numeric:tabular-nums}
.ctrls{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px}
.ctrls .c{width:48px;height:48px;display:grid;place-items:center;color:#fff;position:relative}
.ctrls .c.dimmed{color:rgba(255,255,255,.6)}
.ctrls .c.on{color:var(--acc)}
.ctrls .c.on::after{content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--acc)}
.ctrls .c .one{position:absolute;font-size:9px;font-weight:800;top:11px;right:9px}
.ctrls .pp{width:70px;height:70px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center}
.ctrls .pp:active,.ctrls .c:active{transform:scale(.93)}
.fbot{display:flex;justify-content:space-between;align-items:center}
.fbot button{width:40px;height:40px;display:grid;place-items:center;color:rgba(255,255,255,.8)}

/* queue panel */
#queue{position:absolute;inset:0;z-index:3;background:rgba(14,14,17,.97);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
#queue.open{transform:none}
#queue .qh{display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 14px) 18px 10px;max-width:880px;width:100%;margin:0 auto}
#queue .qh h1{flex:1;font-size:22px;margin:0;font-weight:800}
#queue .qb{flex:1;overflow-y:auto;padding:0 18px calc(var(--sab) + 30px);max-width:880px;width:100%;margin:0 auto}
#queue h2{font-size:15px;color:var(--mute);margin:18px 0 6px;font-weight:600}

/* sheet + dialog */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:#1c1c22;border-radius:18px 18px 0 0;
  padding:10px 0 calc(var(--sab) + 14px);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:80vh;overflow-y:auto;max-width:560px;margin:0 auto}
#sheet.on{transform:none}
#sheet .grab{width:38px;height:4px;border-radius:4px;background:#44444e;margin:0 auto 10px}
#sheet .sh{display:flex;align-items:center;gap:12px;padding:6px 20px 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
#sheet .sh .art{width:48px;height:48px;border-radius:6px}
#sheet .sh .t{font-weight:700}
#sheet .sh .s{color:var(--mute);font-size:13px;margin-top:2px}
#sheet .opt{display:flex;align-items:center;gap:16px;width:100%;padding:13px 22px;font-size:15.5px;font-weight:500;text-align:left}
#sheet .opt:active{background:var(--card2)}
#sheet .opt svg{color:var(--mute);flex:none}
#sheet .opt.danger{color:#ff6b6b}
#sheet .opt.danger svg{color:#ff6b6b}
#dialog{position:fixed;z-index:62;left:50%;top:50%;width:min(360px,calc(100% - 40px));transform:translate(-50%,-46%) scale(.96);opacity:0;pointer-events:none;
  background:#1f1f26;border-radius:16px;padding:22px;transition:.22s}
#dialog.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
#dialog h3{margin:0 0 6px;font-size:18px}
#dialog p{margin:0 0 14px;color:var(--mute);font-size:14px;line-height:1.45}
#dialog label{display:block;font-size:12px;color:var(--mute);margin:10px 0 5px;font-weight:600}
#dialog input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;outline:0}
#dialog input:focus{border-color:var(--acc)}
#dialog .db{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
#dialog .db .btn{padding:11px 18px;font-size:14.5px}
#dialog .db .btn.danger{background:#ff5b5b;color:#1a0505}

/* toast & drop */
#toast{position:fixed;left:50%;bottom:calc(var(--tab) + var(--mini) + var(--sab) + 18px);transform:translateX(-50%) translateY(20px);opacity:0;z-index:70;
  background:#f5f5f7;color:#111;padding:11px 18px;border-radius:10px;font-size:14px;font-weight:600;transition:.25s;pointer-events:none;max-width:calc(100% - 40px);text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#drop{position:fixed;inset:0;z-index:80;background:rgba(255,90,54,.16);border:3px dashed var(--acc);display:grid;place-items:center;font-size:22px;font-weight:800;pointer-events:none;opacity:0;transition:.15s}
#drop.on{opacity:1}
#prog{position:fixed;left:0;top:0;height:3px;background:var(--acc);z-index:90;width:0;transition:width .2s}

.stat{display:flex;gap:10px;margin:6px 0 4px}
.stat div{flex:1;background:var(--card);border-radius:12px;padding:14px}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{color:var(--mute);font-size:12.5px}
.setrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;font-size:15px}
.setrow .x{flex:1}
.setrow small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
@media (min-width:760px){
  .quick{grid-template-columns:repeat(3,1fr)}
  .top h1{font-size:32px}
}
</style>
</head>
<body>
<div id="prog"></div>
<main id="main"><div class="wrap" id="view"></div></main>

<div id="mini" class="hidden">
  <button class="art" id="miniArt" aria-label="Apri player"></button>
  <button class="meta" id="miniMeta"><div class="t" id="miniT"></div><div class="s" id="miniS"></div></button>
  <button class="ctl" id="miniFav" aria-label="Mi piace"></button>
  <button class="ctl" id="miniPP" aria-label="Play/pausa"></button>
  <div class="bar"><i id="miniBar"></i></div>
</div>

<nav id="tabs">
  <button data-tab="home" class="on"><span data-ic="home"></span>Home</button>
  <button data-tab="search"><span data-ic="search"></span>Cerca</button>
  <button data-tab="library"><span data-ic="lib"></span>La tua libreria</button>
</nav>

<section id="full" aria-hidden="true">
  <div class="bgimg" id="fullBg"></div><div class="shade"></div>
  <div class="in">
    <div class="fh">
      <button class="iconbtn back" id="fullClose" style="background:transparent" aria-label="Chiudi"></button>
      <div class="lbl">In riproduzione da<b id="fullFrom">La tua libreria</b></div>
      <button class="iconbtn" id="fullMore" style="background:transparent" aria-label="Altro"></button>
    </div>

/* ---------- ID3 parsing ---------- */
function decodeText(bytes, enc){

    }

}

  if (enc === 1 || enc === 2) { for (let i = start; i + 1 < b.length; i += 2) if (b[i] === 0 && b[i+1] === 0) return i; return b.length; }

async function readID3(file){
  const out = {};

    const head = new Uint8Array(await file.slice(0, 10).arrayBuffer());
    if (head[0] !== 0x49 || head[1] !== 0x44 || head[2] !== 0x33) return out; // "ID3"
    const ver = head[3], flags = head[5];
    const size = (head[6]&0x7f)<<21 | (head[7]&0x7f)<<14 | (head[8]&0x7f)<<7 | (head[9]&0x7f);
    const b = new Uint8Array(await file.slice(10, 10 + size).arrayBuffer());

      else fs = (b[p+4]<<24 | b[p+5]<<16 | b[p+6]<<8 | b[p+7]) >>> 0;
      const d = b.subarray(p + hdr, p + hdr + fs);

      if (!fs || !d.length) continue;

function fromName(name){

async function importFiles(files, opt = {}){

/* ---------- derived collections ---------- */
const coll = (a, b) => a.localeCompare(b, 'it', {sensitivity:'base'});
function albums(){
  const m = new Map();

  return [...m.values()].sort((x,y) => coll(x.name, y.name));
}
function artists(){
  const m = new Map();
  for (const t of tracks) { const k = norm(t.artist); if (!m.has(k)) m.set(k, {key:k, name:t.artist, tracks:[]}); m.get(k).tracks.push(t); }
  for (const a of m.values()) { a.tracks.sort((x,y) => coll(x.album||'',y.album||'') || (x.trackNo||0)-(y.trackNo||0)); a.cover = a.tracks.find(t => cover(t)) || a.tracks[0]; }
  return [...m.values()].sort((x,y) => coll(x.name, y.name));
}
const songsSorted = () => [...tracks].sort((a,b) => coll(a.title, b.title));
const favs = () => tracks.filter(t => t.fav).sort((a,b) => (b.favAt||0)-(a.favAt||0));

/* ---------- YouTube (player ufficiale) ---------- */
function ytApi(){
  if (YTS.api) return YTS.api;
  YTS.api = new Promise((res, rej) => {
    if (window.YT && window.YT.Player) return res(window.YT);
    const prevCb = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (prevCb) try { prevCb(); } catch(e) {} res(window.YT); };
    const sc = document.createElement('script'); sc.src = 'https://www.youtube.com/iframe_api'; sc.async = true;
    sc.onerror = () => { YTS.api = null; rej(new Error('yt api')); };
    document.head.appendChild(sc);
    setTimeout(() => { if (!(window.YT && window.YT.Player)) { YTS.api = null; rej(new Error('timeout')); } }, 15000);
  });
  return YTS.api;
}
async function ytLoad(t, autoplay){
  const YT = await ytApi();
  const start = YTS.resumeAt || 0; YTS.resumeAt = 0;
  if (!YTS.player) {
    await new Promise(res => {
      YTS.player = new YT.Player('ytFrame', {
        width: '100%', height: '100%', videoId: t.ytId,
        playerVars: { playsinline: 1, rel: 0, modestbranding: 1, autoplay: autoplay ? 1 : 0, start: Math.floor(start) },
        events: {
          onReady: () => { if (autoplay) try { YTS.player.playVideo(); } catch(e) {} res(); },
          onStateChange: ytState,
          onError: () => { toast('Questo video non si può riprodurre fuori da YouTube'); setTimeout(() => next(true), 1500); }
        }

      setTimeout(res, 8000);
    });
  } else if (autoplay) YTS.player.loadVideoById({ videoId: t.ytId, startSeconds: start });
  else YTS.player.cueVideoById({ videoId: t.ytId, startSeconds: start });

  clearInterval(YTS.timer); YTS.timer = setInterval(() => { if (isYT()) tick(); }, 500);
}
function ytState(e){

  else if (st === 2 || st === 5 || st === -1) YTS.paused = true;

}
function ytIdOf(u){

}
async function oembed(url){

}

}

/* Decoder XZ/LZMA2 minimale (per i file .playlist di Demus) */
function unxz(u8){

  const tree = (pr, off, k) => { let m = 1; for (let i = 0; i < k; i++) m = (m << 1) + bit(pr, off + m); return m - (1 << k); };
  const rtree = (pr, off, k) => { let m = 1, s = 0; for (let i = 0; i < k; i++) { const b = bit(pr, off + m); m = (m << 1) + b; s |= b << i; } return s; };

  const reset = () => {
    for (const a of [isMatch, isRep, g0, g1, g2, rep0Long, slot, posDec, align, lenD.c, lenD.low, lenD.mid, lenD.high, repD.c, repD.low, repD.mid, repD.high, lit]) a.fill(1024);
    state = 0; r0 = r1 = r2 = r3 = 0;
  };
  const chunk = size => {
    const end = n + size;
    while (n < end) {
      const ps = n & ((1 << pb) - 1);
      if (bit(isMatch, (state << 4) + ps) === 0) {
        const prev = n ? out[n - 1] : 0, base = 0x300 * (((n & ((1 << lp) - 1)) << lc) + (prev >> (8 - lc)));
        let s = 1;
        if (state >= 7) { let mb = out[n - r0 - 1]; do { const m = (mb >> 7) & 1; mb <<= 1; const b = bit(lit, base + ((1 + m) << 8) + s); s = (s << 1) | b; if (m !== b) break; } while (s < 0x100); }
        while (s < 0x100) s = (s << 1) | bit(lit, base + s);
        put(s - 0x100); state = state < 4 ? 0 : state < 10 ? state - 3 : state - 6; continue;
      }
      let L;

          if (bit(rep0Long, (state << 4) + ps) === 0) { state = state < 7 ? 9 : 11; put(out[n - r0 - 1]); continue; }
        } else {
          let d; if (bit(g1, state) === 0) d = r1; else { if (bit(g2, state) === 0) d = r2; else { d = r3; r3 = r2; } r2 = r1; } r1 = r0; r0 = d;
        }

      } else {
        r3 = r2; r2 = r1; r1 = r0; L = len(lenD, ps); state = state < 7 ? 7 : 10;
        const sl = tree(slot, Math.min(L, 3) << 6, 6);
        if (sl < 4) r0 = sl;
        else {
          const nb = (sl >> 1) - 1; let d = (2 | (sl & 1)) * Math.pow(2, nb);

        }

    for (;;) {

      if (c === 1 || c === 2) { const sz = ((u8[p] << 8) | u8[p + 1]) + 1; p += 2; for (let i = 0; i < sz; i++) put(u8[p++]); continue; }

      ip = p + 1; range = 0xFFFFFFFF; code = 0; for (let i = 0; i < 4; i++) code = code * 256 + u8[ip++];
      chunk(un); p += pk;
    }
    while (p % 4) p++;

  }
  return out.subarray(0, n);
}

/* ---------- file di playlist (.playlist di Demus, .m3u, .pls, .json) ---------- */
const isListFile = f => /\.(playlist|m3u8?|pls|json)$/i.test(f.name);
async function addYTMeta(m){
  const ex = tracks.find(t => t.kind === 'yt' && t.ytId === m.v); if (ex) return ex.id;
  if (!m.title) return addYT(m.v);
  const art = m.art ? String(m.art).replace(/=w\d+-h\d+/, '=w544-h544') : `https://i.ytimg.com/vi/${m.v}/hqdefault.jpg`;
  const t = { id: uid(), kind: 'yt', ytId: m.v, title: String(m.title), artist: String(m.artist || 'YouTube'), album: String(m.album || ''), year: '', genre: '', trackNo: +m.no || 0,
    cover: null, coverUrl: art, duration: +m.duration || 0, added: Date.now() + Math.random(), plays: 0, lastPlayed: 0, fav: false };
  await db.put('tracks', t); tracks.push(t); byId.set(t.id, t); return t.id;
}
const pick = (...v) => { for (const x of v) { if (x == null) continue; if (typeof x === 'string' || typeof x === 'number') return String(x); if (x.name) return String(x.name); if (Array.isArray(x) && x.length) return pick(x[0]); } return ''; };

    name = pick(j.title, j.name) || name;
    const arr = Array.isArray(j) ? j : (j.songs || j.tracks || j.items || j.videos || j.entries || []);
    entries = arr.map(s => {
      const id = s.videoId || s.youtubeId || s.ytId || (typeof s.id === 'string' && /^[\w-]{11}$/.test(s.id) ? s.id : null);
      return { v: id, title: pick(s.title, s.name), artist: pick(s.artistName, s.artist, s.artists, s.author), album: pick(s.albumTitle, s.album), duration: s.duration || s.durationSeconds,
        art: pick(s.artwork, s.thumbnailUrl, s.thumbnail, s.cover), no: s.albumIndex, url: pick(s.url, s.link), raw: pick(s.path, s.file, s.filename) };
    });

  for (let k = 0; k < entries.length; k++) {
    const e = entries[k]; prog.style.width = Math.max(6, k / entries.length * 100) + '%';
    try {
      if (e.v) { ids.push(await addYTMeta(e)); continue; }
      const link = e.url && /^https?:\/\//i.test(e.url) && !/^https:\/\/local\.invalid\//.test(e.url) ? e.url : '';
      if (link) {
        if (SANDBOX) { missing.push(e.title || link); continue; }
        const y = ytIdOf(link);
        if (y && y.v) ids.push(await addYTMeta({ v: y.v, title: e.title && splitTitle(e.title).title, artist: e.title && splitTitle(e.title).artist }));
        else ids.push(...await fetchAudio(link, e.title ? splitTitle(e.title) : null));

}
async function handleFiles(list){

/* ---------- importa da link ---------- */
function directURL(u){
  try {
    const x = new URL(u), h = x.hostname;
    if (/(^|\.)dropbox\.com$/.test(h)) { x.hostname = 'dl.dropboxusercontent.com'; x.searchParams.delete('dl'); x.searchParams.delete('st'); return x.href; }
    if (h === 'drive.google.com') { const m = x.pathname.match(/\/file\/d\/([\w-]+)/); const id = (m && m[1]) || x.searchParams.get('id'); if (id) return `https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t`; }
    if (h === 'onedrive.live.com' || h === '1drv.ms') return u;
  } catch(e) {}
  return u;
}
function nameFromURL(u, type){
  let n = ''; try { n = decodeURIComponent(new URL(u).pathname.split('/').filter(Boolean).pop() || ''); } catch(e) {}
  if (!/\.\w{2,4}$/.test(n)) n = (n || 'brano') + (/mp4|m4a|aac/.test(type) ? '.m4a' : /wav/.test(type) ? '.wav' : /ogg/.test(type) ? '.ogg' : /flac/.test(type) ? '.flac' : '.mp3');
  return n;
}
function fnameFromCD(r){ const cd = r.headers.get('content-disposition') || ''; const m = cd.match(/filename\*?=(?:UTF-8'')?"?([^";]+)/i); return m ? decodeURIComponent(m[1]) : ''; }
async function fetchAudio(u, title){
  const url = directURL(u);
  const r = await fetch(url, { redirect: 'follow' });
  if (!r.ok) throw new Error('http ' + r.status);
  const ct = (r.headers.get('content-type') || '').split(';')[0];
  if (/text\/html/.test(ct)) throw new Error('html');
  const blob = await r.blob();
  const type = /^audio\//.test(ct) ? ct : (blob.type && /^audio\//.test(blob.type) ? blob.type : 'audio/mpeg');
  const f = new File([blob], fnameFromCD(r) || nameFromURL(url, type), { type });
  return importFiles([f], { silent: true, title });
}
function parseList(text, base){
  const out = []; let pendingTitle = null;
  if (/^\s*\[playlist\]/i.test(text)) {
    const files = {}, titles = {};
    text.split(/\r?\n/).forEach(l => { let m = l.match(/^File(\d+)=(.+)$/i); if (m) files[m[1]] = m[2].trim(); m = l.match(/^Title(\d+)=(.+)$/i); if (m) titles[m[1]] = m[2].trim(); });
    Object.keys(files).sort((a, b) => a - b).forEach(k => { let url = ''; try { url = new URL(files[k], base).href; } catch(e) {} out.push({ url, title: titles[k], raw: files[k] }); });
    return out;
  }
  for (let l of text.split(/\r?\n/)) {
    l = l.trim(); if (!l) continue;
    if (l.startsWith('#EXTINF')) { pendingTitle = l.replace(/^#EXTINF:[^,]*,/, '').trim(); continue; }
    if (l.startsWith('#')) continue;
    try { out.push({ url: new URL(l, base).href, title: pendingTitle, raw: l }); } catch(e) { out.push({ url: '', title: pendingTitle, raw: l }); }
    pendingTitle = null;
  }
  return out;
}

async function importLinks(text){
  const urls = [...new Set((String(text).match(/https?:\/\/[^\s<>"'`]+/g) || []).map(u => u.replace(/[),.;]+$/, '')))];
  if (!urls.length) { toast('Nessun link trovato'); return; }
  const prog = $('#prog'); prog.style.width = '6%';
  const res = { ids: [], fail: [], drm: [], playlists: [] };
  const step = (i, n) => prog.style.width = Math.max(6, (i / n) * 100) + '%';
  for (let i = 0; i < urls.length; i++) {
    const u = urls[i]; step(i, urls.length);
    let host = ''; try { host = new URL(u).hostname.replace(/^www\./, ''); } catch(e) { res.fail.push(u); continue; }
    const y = ytIdOf(u);
    try {
      if (DRM.test(host)) { res.drm.push(host); continue; }
      if (y && y.list && (!y.v || urls.length === 1 && /playlist/.test(u))) {
        toast('Leggo la playlist YouTube…');
        const [ids, meta] = await Promise.all([ytPlaylistIds(y.list), oembed('https://www.youtube.com/playlist?list=' + y.list)]);
        if (!ids.length) { res.fail.push(u); continue; }
        const got = [];
        for (let k = 0; k < ids.length; k += 6) {
          const part = await Promise.all(ids.slice(k, k + 6).map(v => addYT(v).catch(() => null)));
          got.push(...part.filter(Boolean)); prog.style.width = Math.max(6, (k / ids.length) * 100) + '%';
        }
        res.ids.push(...got); res.playlists.push(await makePlaylist((meta && meta.title) || 'Playlist YouTube', got));
        continue;
      }
      if (y && y.v) { res.ids.push(await addYT(y.v)); continue; }
      if (/\.(m3u8?|pls)(\?|#|$)/i.test(u)) {
        const r = await fetch(directURL(u)); if (!r.ok) throw new Error('http');
        const items = parseList(await r.text(), r.url || u);
        const got = [];
        for (const it of items) {
          const yy = ytIdOf(it.url);
          try { if (yy && yy.v) got.push(await addYT(yy.v)); else got.push(...await fetchAudio(it.url, it.title ? splitTitle(it.title) : null)); } catch(e) { res.fail.push(it.url); }
        }
        res.ids.push(...got);
        if (got.length) res.playlists.push(await makePlaylist(nameFromURL(u, '').replace(/\.\w+$/, '').replace(/[_-]+/g, ' ') || 'Playlist', got));
        continue;
      }
      const ids = await fetchAudio(u); if (!ids.length) throw new Error('noaudio'); res.ids.push(...ids);
    } catch(e) { console.warn('link', u, e); res.fail.push(u); }
  }
  prog.style.width = '100%'; setTimeout(() => prog.style.width = '0', 400);
  render();
  const n = new Set(res.ids).size;
  if (res.playlists.length === 1 && !res.fail.length && !res.drm.length) { go('pl:' + res.playlists[0].id); toast(`Playlist “${res.playlists[0].name}” · ${n} brani`); return; }
  if (n && !res.fail.length && !res.drm.length) { toast(n === 1 ? 'Brano aggiunto' : `${n} brani aggiunti`); return; }
  let msg = n ? `${n} ${n === 1 ? 'brano aggiunto' : 'brani aggiunti'}. ` : '';
  if (res.drm.length) msg += `${[...new Set(res.drm.map(svcName))].join(', ')}: ${res.drm.length === 1 ? 'questo servizio protegge' : 'questi servizi proteggono'} l’audio e non lo lascia${res.drm.length === 1 ? '' : 'no'} usare fuori dalla ${res.drm.length === 1 ? 'sua' : 'loro'} app. Cerca lo stesso brano su YouTube e incolla quel link, oppure carica l’MP3. `;
  if (res.fail.length) msg += `${res.fail.length} ${res.fail.length === 1 ? 'link non si è aperto' : 'link non si sono aperti'}: il sito non permette il download diretto o il link non porta a un file audio. Scarica il file e caricalo dal dispositivo.`;
  await dialog({ title: n ? 'Fatto, quasi tutto' : 'Non sono riuscito ad aggiungerli', text: msg.trim(), ok: 'OK', noCancel: true });
}
async function makePlaylist(name, ids){
  const p = { id: uid(), name: name.slice(0, 80), ids: [...new Set(ids)], created: Date.now() };
  playlists.push(p); await db.put('playlists', p); return p;
}

/* session restore */
let saveT;
function saveSession(){ clearTimeout(saveT); saveT = setTimeout(() => { db.put('kv', { queue: PL.queue, orig: PL.orig, i: PL.i, shuffle: PL.shuffle, repeat: PL.repeat, from: PL.from, pos: curTime() || 0 }, 'session').catch(()=>{}); }, 300); }
setInterval(() => { if (!isPaused()) saveSession(); }, 10000);
async function restoreSession(){
  try {
    const s = await db.get('kv', 'session'); if (!s || !s.queue || !s.queue.length) return;
    PL.queue = s.queue.filter(id => byId.has(id)); PL.orig = (s.orig || s.queue).filter(id => byId.has(id));
    if (!PL.queue.length) return;
    PL.i = Math.min(Math.max(0, s.i), PL.queue.length - 1); PL.shuffle = !!s.shuffle; PL.repeat = s.repeat || 'off'; PL.from = s.from || 'La tua libreria';
    const ct = byId.get(PL.queue[PL.i]);
    if (ct && ct.kind === 'yt') { PL.cur = ct; YTS.resumeAt = s.pos || 0; updateNow(); return; }
    const blob = await db.get('audio', PL.queue[PL.i]); if (!blob) return;
    PL.cur = byId.get(PL.queue[PL.i]); PL.url = URL.createObjectURL(blob); audio.src = PL.url;
    audio.addEventListener('loadedmetadata', function once(){ audio.removeEventListener('loadedmetadata', once); if (s.pos) audio.currentTime = s.pos; }, { once: true });
    updateNow();
  } catch(e) {}
}

/* ---------- sheet / dialog / toast ---------- */
function openSheet(html){ $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#sheet').classList.add('on'); $('#scrim').classList.add('on'); }
function closeAll(){ $('#sheet').classList.remove('on'); $('#dialog').classList.remove('on'); $('#scrim').classList.remove('on'); }
$('#scrim').onclick = closeAll;
let toastT;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }
function dialog({ title, text = '', fields = [], ok = 'OK', danger = false, extra = '', noCancel = false }){
  return new Promise(res => {
    const d = $('#dialog');
    d.innerHTML = `<h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ''}
      <form id="dform">${fields.map((f, i) => `<label for="df${i}">${esc(f.label)}</label>` + (f.area ? `<textarea id="df${i}" placeholder="${esc(f.ph || '')}" autocomplete="off" autocapitalize="off" spellcheck="false">${esc(f.value || '')}</textarea>` : `<input id="df${i}" value="${esc(f.value || '')}" placeholder="${esc(f.ph || '')}" autocomplete="off">`)).join('')}
      ${extra || ''}
      <div class="db"><button type="button" class="btn sec ${noCancel ? 'hidden' : ''}" id="dcancel">Annulla</button><button type="submit" class="btn ${danger ? 'danger' : ''}">${esc(ok)}</button></div></form>`;
    $('#sheet').classList.remove('on'); d.classList.add('on'); $('#scrim').classList.add('on');
    const first = d.querySelector('input,textarea'); if (first) setTimeout(() => { first.focus(); if (first.select) first.select(); }, 60);
    const done = v => { closeAll(); res(v); };
    $('#dcancel').onclick = () => done(null);
    $('#scrim').onclick = () => { $('#scrim').onclick = closeAll; done(null); };
    $('#dform').onsubmit = e => { e.preventDefault(); done(fields.length ? fields.map((_, i) => $('#df' + i).value.trim()) : true); };
  });
}

function trackSheet(id, plId){
  const t = byId.get(id); if (!t) return;
  const al = t.album ? albums().find(a => a.key === norm(t.album) + '|' + norm(t.artist)) : null;
  const opt = (act, icon, label, cls='') => `<button class="opt ${cls}" data-sa="${act}">${ic(icon, 22, 2)}${label}</button>`;
  openSheet(`<div class="sh">${artHTML(t)}<div style="min-width:0"><div class="t">${esc(t.title)}</div><div class="s">${esc(t.artist)}</div></div></div>
    ${opt('fav', t.fav ? 'heartF' : 'heart', t.fav ? 'Rimuovi da Brani che ti piacciono' : 'Aggiungi a Brani che ti piacciono')}
    ${opt('addpl', 'plusC', 'Aggiungi a playlist')}
    ${plId ? opt('rmpl', 'minus', 'Rimuovi da questa playlist') : ''}
    ${opt('next', 'playNext', 'Riproduci dopo')}
    ${opt('queue', 'queue', 'Aggiungi alla coda')}
    ${al ? opt('album', 'album', 'Vai all’album') : ''}
    ${opt('artist', 'user', 'Vai all’artista')}
    ${opt('edit', 'edit', 'Modifica info')}
    ${opt('del', 'trash', 'Elimina dalla libreria', 'danger')}`);
  $('#sheet').onclick = async e => {
    const b = e.target.closest('[data-sa]'); if (!b) return;
    const a = b.dataset.sa; closeAll(); $('#sheet').onclick = null;
    if (a === 'fav') toggleFav(id);
    else if (a === 'addpl') addToPlaylistSheet(id);
    else if (a === 'rmpl') { const p = playlists.find(x => x.id === plId); if (p) { const k = p.ids.indexOf(id); if (k >= 0) p.ids.splice(k, 1); await db.put('playlists', p); toast('Rimosso dalla playlist'); render(); } }
    else if (a === 'next') playNextId(id);
    else if (a === 'queue') addQueue(id);
    else if (a === 'album') { closeFull(); go('al:' + al.key); }
    else if (a === 'artist') { closeFull(); go('ar:' + norm(t.artist)); }
    else if (a === 'edit') editTrack(id);
    else if (a === 'del') deleteTrack(id);
  };
}
function addToPlaylistSheet(id){
  openSheet(`<div class="sh"><div style="font-weight:700;font-size:17px">Aggiungi a playlist</div></div>
    <button class="opt" data-pa="new">${ic('plus', 22, 2)}Nuova playlist</button>
    ${playlists.map(p => `<button class="opt" data-pa="${p.id}">${ic('list', 22, 2)}${esc(p.name)} <span class="sub" style="margin-left:auto">${p.ids.length}</span></button>`).join('')}`);
  $('#sheet').onclick = async e => {
    const b = e.target.closest('[data-pa]'); if (!b) return; $('#sheet').onclick = null;
    let p;
    if (b.dataset.pa === 'new') { p = await newPlaylist(true); if (!p) return; }
    else { p = playlists.find(x => x.id === b.dataset.pa); closeAll(); }
    if (p.ids.includes(id)) { toast('Già presente in ' + p.name); return; }
    p.ids.push(id); await db.put('playlists', p); toast('Aggiunto a ' + p.name); render();
  };
}
async function newPlaylist(silent){
  const r = await dialog({ title: 'Nuova playlist', fields: [{ label: 'Nome', value: 'La mia playlist ' + (playlists.length + 1) }], ok: 'Crea' });
  if (!r || !r[0]) return null;
  const p = { id: uid(), name: r[0], ids: [], created: Date.now() };
  playlists.push(p); await db.put('playlists', p);
  if (!silent) { toast('Playlist creata'); go('pl:' + p.id); }
  return p;
}
function playlistSheet(plId){
  const p = playlists.find(x => x.id === plId); if (!p) return;
  openSheet(`<div class="sh"><div style="font-weight:700;font-size:17px">${esc(p.name)}</div></div>
    <button class="opt" data-pm="rename">${ic('edit', 22, 2)}Rinomina</button>
    <button class="opt danger" data-pm="del">${ic('trash', 22, 2)}Elimina playlist</button>`);
  $('#sheet').onclick = async e => {
    const b = e.target.closest('[data-pm]'); if (!b) return; $('#sheet').onclick = null;
    if (b.dataset.pm === 'rename') { const r = await dialog({ title: 'Rinomina playlist', fields: [{ label: 'Nome', value: p.name }], ok: 'Salva' }); if (r && r[0]) { p.name = r[0]; await db.put('playlists', p); render(); } }
    else { const ok = await dialog({ title: 'Eliminare la playlist?', text: `“${p.name}” verrà eliminata. I brani restano nella libreria.`, ok: 'Elimina', danger: true }); if (ok) { playlists = playlists.filter(x => x !== p); await db.del('playlists', p.id); back(); toast('Playlist eliminata'); } }
  };
}
async function editTrack(id){
  const t = byId.get(id);
  const r = await dialog({ title: 'Modifica info', fields: [{ label: 'Titolo', value: t.title }, { label: 'Artista', value: t.artist }, { label: 'Album', value: t.album, ph: 'Facoltativo' }], ok: 'Salva' });
  if (!r) return;
  t.title = r[0] || t.title; t.artist = r[1] || 'Artista sconosciuto'; t.album = r[2];
  await db.put('tracks', t); updateNow(); render(); toast('Informazioni aggiornate');
}
async function deleteTrack(id){
  const t = byId.get(id);
  const ok = await dialog({ title: 'Eliminare il brano?', text: `“${t.title}” verrà rimosso da questo dispositivo.`, ok: 'Elimina', danger: true });
  if (!ok) return;
  await db.del('tracks', id); await db.del('audio', id);
  tracks = tracks.filter(x => x.id !== id); byId.delete(id);
  if (coverURL.has(id)) { URL.revokeObjectURL(coverURL.get(id)); coverURL.delete(id); }
  for (const p of playlists) if (p.ids.includes(id)) { p.ids = p.ids.filter(x => x !== id); await db.put('playlists', p); }
  const wasCur = PL.cur && PL.cur.id === id, qi = PL.queue.indexOf(id);
  PL.orig = PL.orig.filter(x => x !== id);
  if (qi >= 0) { PL.queue.splice(qi, 1); if (qi < PL.i) PL.i--; }
  if (wasCur) { doPause(); if (PL.queue.length) { PL.i = Math.min(PL.i, PL.queue.length - 1); loadCurrent(false); } else { PL.cur = null; audio.removeAttribute('src'); closeFull(); updateNow(); } }
  saveSession(); render(); toast('Brano eliminato');
}
async function settings(){
  let used = '', quota = '';
  try { const e = await navigator.storage.estimate(); used = (e.usage / 1048576).toFixed(0) + ' MB'; quota = (e.quota / 1073741824).toFixed(1) + ' GB'; } catch(e) {}
  let persisted = false; try { persisted = await navigator.storage.persisted(); } catch(e) {}
  const tot = tracks.reduce((s, t) => s + (t.duration || 0), 0);
  openSheet(`<div class="sh"><div style="font-weight:700;font-size:17px">Impostazioni</div></div>
    <div style="padding:0 20px">
    <div class="stat"><div><b>${tracks.length}</b><span>brani</span></div><div><b>${fmt(tot).split(':').slice(0,-1).join(':') || 0}</b><span>ore:min di musica</span></div><div><b>${used || '—'}</b><span>spazio usato${quota ? ' su ' + quota : ''}</span></div></div>
    <div class="setrow"><div class="x">Archiviazione<small>${memMode ? 'Temporanea: questo browser non permette di salvare i file. Apri l’app dal suo indirizzo per salvarli.' : persisted ? 'Protetta: il browser non cancellerà la tua musica.' : 'La musica è salvata su questo dispositivo, in questo browser.'}</small></div></div>
    <button class="setrow" data-st="import">${ic('upload', 22, 2)}<div class="x">Carica altra musica<small>MP3, M4A, WAV, FLAC, OGG · playlist .playlist, .m3u, .pls</small></div></button>
    <button class="setrow" data-st="link">${ic('link', 22, 2)}<div class="x">Aggiungi da link<small>YouTube, Dropbox, Google Drive, file MP3, playlist .m3u</small></div></button>
    <button class="setrow" data-st="wipe" style="color:#ff6b6b">${ic('trash', 22, 2)}<div class="x">Svuota libreria<small style="color:#c77">Elimina tutti i brani e le playlist da questo dispositivo</small></div></button>
    </div>`);
  $('#sheet').onclick = async e => {
    const b = e.target.closest('[data-st]'); if (!b) return; $('#sheet').onclick = null;
    if (b.dataset.st === 'import') { closeAll(); $('#file').click(); }
    else if (b.dataset.st === 'link') { closeAll(); addLinkSheet(); }
    else { const ok = await dialog({ title: 'Svuotare la libreria?', text: 'Tutti i brani e le playlist verranno eliminati da questo dispositivo. L’operazione non si può annullare.', ok: 'Svuota', danger: true });
      if (ok) { doPause(); audio.removeAttribute('src'); await Promise.all(['tracks','audio','playlists','kv'].map(s => db.clear(s))); tracks = []; playlists = []; byId.clear(); PL.queue = []; PL.orig = []; PL.cur = null; closeFull(); updateNow(); setTab('home'); toast('Libreria svuotata'); } }
  };
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const more = t.closest('[data-more]'); if (more) { e.stopPropagation(); return trackSheet(more.dataset.more, more.dataset.pl); }
  const plm = t.closest('[data-plmenu]'); if (plm) return playlistSheet(plm.dataset.plmenu);
  const qi = t.closest('[data-qi]'); if (qi) { PL.i = +qi.dataset.qi; loadCurrent(true); return; }
  const r = t.closest('[data-row]');
  if (r && r.dataset.ctx !== 'queue') { const ctx = r.dataset.ctx || 'top'; return playList(ctxList(ctx), r.dataset.row, ctxName(ctx)); }
  if (r && r.dataset.ctx === 'queue') return;
  const pc = t.closest('[data-play]'); if (pc) { const ctx = pc.dataset.ctx; return playList(ctxList(ctx), pc.dataset.play, ctxName(ctx)); }
  const g = t.closest('[data-go]'); if (g) return go(g.dataset.go);
  const gl = t.closest('[data-golib]'); if (gl) { S.libFilter = gl.dataset.golib; return setTab('library'); }
  const gn = t.closest('[data-genre]'); if (gn) { S.q = gn.dataset.genre; return renderSearch(); }
  const lb = t.closest('[data-lib]'); if (lb) { S.libFilter = lb.dataset.lib; return render(); }
  const tb = t.closest('[data-tab]'); if (tb) return setTab(tb.dataset.tab);
  const a = t.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'import') addMusicSheet();
  else if (act === 'pickfiles') $('#file').click();
  else if (act === 'addlink') addLinkSheet();
  else if (act === 'back') back();
  else if (act === 'settings') settings();
  else if (act === 'newpl') newPlaylist();
  else if (act === 'playall') playList(songsSorted(), null, 'Tutti i brani', false);
  else if (act === 'shufall') playList(songsSorted(), null, 'Tutti i brani', true);
  else if (act === 'playctx') playList(V._ctx.list, null, V._ctx.title, false);
  else if (act === 'shufctx') playList(V._ctx.list, null, V._ctx.title, true);
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input')) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'Enter' && e.target.closest && e.target.closest('[data-row]')) e.target.click();
  else if (e.key === 'Escape') { if ($('#scrim').classList.contains('on')) closeAll(); else if ($('#queue').classList.contains('open')) $('#queue').classList.remove('open'); else closeFull(); }
});
$('#file').onchange = e => { handleFiles(e.target.files); e.target.value = ''; };
document.addEventListener('paste', e => { if (e.target.closest && e.target.closest('input,textarea')) return; const t = (e.clipboardData && e.clipboardData.getData('text')) || ''; if (/https?:\/\//.test(t)) { e.preventDefault(); addLinkSheet(t); } });
$('#miniMeta').onclick = openFull; $('#miniArt').onclick = openFull;
$('#miniPP').onclick = togglePlay; $('#miniFav').onclick = () => PL.cur && toggleFav(PL.cur.id);
$('#pp').onclick = togglePlay; $('#next').onclick = () => next(false); $('#prev').onclick = prev;
$('#shuf').onclick = () => setShuffle(!PL.shuffle); $('#rep').onclick = cycleRepeat;
$('#fullFav').onclick = () => PL.cur && toggleFav(PL.cur.id);
$('#fullAdd').onclick = () => PL.cur && addToPlaylistSheet(PL.cur.id);
$('#fullMore').onclick = () => PL.cur && trackSheet(PL.cur.id);
$('#fullClose').innerHTML = ic('down', 28, 2.2); $('#fullClose').onclick = closeFull;
$('#fullMore').innerHTML = ic('more', 22);
$('#fullAdd').innerHTML = ic('plusC', 24, 2); $('#qOpen').innerHTML = ic('queue', 24, 2);
$('#qOpen').onclick = () => { renderQueue(); $('#queue').classList.add('open'); };
$('#qClose').innerHTML = ic('down', 28, 2.2); $('#qClose').onclick = () => $('#queue').classList.remove('open');
$('#prev').innerHTML = ic('prev', 30); $('#next').innerHTML = ic('next', 30); $('#shuf').innerHTML = ic('shuf', 24, 2);

// swipe down to close full player
(() => { let y0 = null, dy = 0; const f = $('#full'), big = f.querySelector('.in');
  big.addEventListener('touchstart', e => { if (e.target.closest('input')) return; y0 = e.touches[0].clientY; dy = 0; f.style.transition = 'none'; }, { passive: true });
  big.addEventListener('touchmove', e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); f.style.transform = `translateY(${dy}px)`; }, { passive: true });
  big.addEventListener('touchend', () => { if (y0 === null) return; f.style.transition = ''; f.style.transform = ''; if (dy > 120) closeFull(); y0 = null; });
})();
// drag & drop
(() => { let n = 0; const d = $('#drop');
  addEventListener('dragenter', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { n++; d.classList.add('on'); } });
  addEventListener('dragleave', () => { n = Math.max(0, n - 1); if (!n) d.classList.remove('on'); });
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => { e.preventDefault(); n = 0; d.classList.remove('on'); if (e.dataTransfer?.files?.length) handleFiles(e.dataTransfer.files); });
})();

/* ---------- boot ---------- */
(async () => {
  await openDB();
  try { tracks = await db.all('tracks'); playlists = (await db.all('playlists')).sort((a,b) => a.created - b.created); }
  catch(e) { memMode = true; tracks = []; playlists = []; }
  tracks.forEach(t => byId.set(t.id, t));
  render(); await restoreSession();
  try { const q = new URLSearchParams(location.search); const shared = [q.get('url'), q.get('text'), q.get('title')].filter(Boolean).join('\n'); if (/https?:\/\//.test(shared)) { history.replaceState(null, '', location.pathname); addLinkSheet(shared); } } catch(e) {}
  try { if ('serviceWorker' in navigator && location.protocol === 'https:' && window.self === window.top) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch(e) {}
})();
